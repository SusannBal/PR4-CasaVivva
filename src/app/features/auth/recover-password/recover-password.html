<div class="min-h-screen flex items-center justify-center px-4 py-20 bg-vivva-beige-light">
    <!-- Decorative background elements -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full bg-vivva-ice/40 blur-3xl"></div>
        <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-vivva-slate/20 blur-3xl"></div>
    </div>

    <div class="w-full max-w-md bg-white rounded-[24px] shadow-vivva-2 border border-vivva-stone/10 p-10 relative z-10">

        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-vivva-forest rounded-full flex items-center justify-center mx-auto mb-6 shadow-vivva-1">
                <span class="text-white font-serif text-2xl font-bold">CV</span>
            </div>
            <h1 class="text-[32px] md:text-[40px] font-serif font-bold text-vivva-charcoal-rich leading-tight">
                Recuperar Cuenta
            </h1>
            <p class="text-[15px] text-vivva-slate mt-2">Te enviaremos las instrucciones a tu correo electrónico</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

            <div class="space-y-2">
                <label class="block text-[13px] font-bold text-vivva-forest uppercase tracking-widest">Email</label>
                <input pInputText formControlName="email" class="input-base" placeholder="tucorreo@email.com" />
                @if (form.controls.email.touched && form.controls.email.invalid) {
                <small class="text-red-500 flex items-center gap-1 mt-1 font-medium">
                    <i class="pi pi-exclamation-circle text-xs"></i> Email inválido
                </small>
                }
            </div>

            @if (errorMessage()) {
            <div class="bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-[10px] text-sm flex items-center gap-2">
                <i class="pi pi-times-circle"></i>
                {{ errorMessage() }}
            </div>
            }

            @if (successMessage()) {
            <div class="bg-green-50 border border-green-100 text-green-700 px-4 py-3 rounded-[10px] text-sm flex items-center gap-2">
                <i class="pi pi-check-circle"></i>
                {{ successMessage() }}
            </div>
            }

            <button type="submit" class="btn-primary w-full gap-2" [disabled]="loading()">
                @if (loading()) {
                    <i class="pi pi-spinner pi-spin"></i>
                }
                Enviar link
            </button>
        </form>

        <div class="text-center mt-10 text-[14px]">
            <a routerLink="/login" class="text-vivva-slate font-bold hover:text-vivva-forest transition-colors flex items-center justify-center gap-2">
                <i class="pi pi-arrow-left text-xs"></i>
                Volver al login
            </a>
        </div>
    </div>
</div>
