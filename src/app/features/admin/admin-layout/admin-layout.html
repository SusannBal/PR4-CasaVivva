<div class="flex h-screen bg-[#f8f9fa] overflow-hidden relative w-full">

  <!-- Top bar solo para móvil -->
  <div class="md:hidden flex items-center justify-between bg-vivva-forest text-white p-4 absolute top-0 w-full z-40 shadow-md h-16">
    <div class="flex items-center gap-3">
      <button (click)="sidebarOpen.set(!sidebarOpen())" class="p-2 focus:outline-none bg-white/10 rounded-lg">
        <i class="pi text-lg" [class.pi-bars]="!sidebarOpen()" [class.pi-times]="sidebarOpen()"></i>
      </button>
      <h1 class="text-lg font-bold font-serif">Casa Vivva</h1>
    </div>
    <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
      <i class="pi pi-user text-xs"></i>
    </div>
  </div>

  <!-- Overlay oscuro para móvil cuando el menú está abierto -->
  @if (sidebarOpen()) {
    <div class="md:hidden fixed inset-0 bg-vivva-charcoal-rich/50 z-40 backdrop-blur-sm transition-opacity" 
         (click)="sidebarOpen.set(false)"></div>
  }

  <!-- Sidebar -->
  <aside 
    class="w-64 bg-vivva-forest text-white flex flex-col flex-shrink-0 fixed md:relative z-50 h-full transition-transform duration-300 shadow-2xl md:shadow-none"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
    [class.md:translate-x-0]="true"> <!-- En desktop siempre está visible (translate-x-0) -->

    <!-- Logo -->
    <div class="p-5 border-b border-white/10 hidden md:block">
      <h1 class="text-xl font-bold font-serif">Casa Vivva</h1>
      <p class="text-white/60 text-xs mt-0.5">Panel de Administración</p>
    </div>

    <!-- Admin info -->
    <div class="p-4 border-b border-white/10 flex items-center gap-3 bg-white/5">
      <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
        <i class="pi pi-user text-sm"></i>
      </div>
      <div class="min-w-0">
        <p class="text-sm font-bold truncate">{{ supabase.userName() }}</p>
        <p class="text-[10px] uppercase tracking-widest text-white/60 font-bold mt-0.5">Administrador</p>
      </div>
    </div>

    <!-- Navegación -->
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{ exact: item.route === '/admin' }"
          routerLinkActive="bg-white/20 font-bold shadow-inner"
          (click)="sidebarOpen.set(false)"
          class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm hover:bg-white/10 transition group"
        >
          <i [class]="'pi ' + item.icon + ' text-white/70 group-hover:text-white transition group-hover:scale-110'"></i>
          {{ item.label }}
        </a>
      }
    </nav>

    <!-- Cerrar sesión -->
    <div class="p-3 border-t border-white/10 bg-white/5">
      <a
        routerLink="/"
        class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm bg-white/10 hover:bg-white/20 transition font-bold mb-2"
      >
        <i class="pi pi-external-link"></i>
        Ver tienda pública
      </a>
      <button
        (click)="signOut()"
        class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl text-sm text-white/60 hover:text-white hover:bg-red-500/20 transition font-bold"
      >
        <i class="pi pi-sign-out"></i>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Contenido principal -->
  <main class="flex-1 overflow-y-auto pt-16 md:pt-0 w-full overflow-x-hidden relative">
    <router-outlet/>
  </main>
</div>
